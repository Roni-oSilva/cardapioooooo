<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Criativo</title>
<style>
/*FONTS*/
*{box-sizing:border-box;margin:0}
body{font-family:Poppins,sans-serif;color:#f8ebd0;background:#1a4a38 url("/*WAVE*/") 0 0/620px 620px;overflow:hidden;position:relative}
body.feed{width:1080px;height:1350px}body.story{width:1080px;height:1920px}
.t{font-family:'Archivo Variable',Impact,sans-serif;font-stretch:86%;font-weight:900;text-transform:uppercase;line-height:.88;letter-spacing:-.015em}
.abs{position:absolute}
.pill{display:inline-block;background:#f8ebd0;color:#6c170b;border-radius:99px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:24px;padding:12px 28px}
.badge{position:absolute;width:236px;height:236px;border-radius:50%;background:#143a2c;color:#f8ebd0;display:grid;place-items:center;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.45);border:6px solid #f8ebd0}
.badge b{font-family:'Archivo Variable';font-stretch:86%;font-weight:900;text-transform:uppercase;font-size:30px;line-height:.95}
.badge small{display:block;font-family:Poppins;font-weight:600;font-size:17px;letter-spacing:.06em;margin-top:6px;opacity:.9}
.panel{background:#f8ebd0;color:#6c170b;border-radius:44px;box-shadow:0 18px 44px rgba(0,0,0,.4)}
.feat{display:flex;align-items:center;gap:16px;font-weight:600;font-size:29px;line-height:1.15;color:#4a1a10}
.feat i{flex:none;width:46px;height:46px;border-radius:50%;background:#143a2c;color:#f8ebd0;display:grid;place-items:center;font-style:normal;font-size:26px;font-weight:700}
.cta{display:inline-flex;align-items:center;gap:14px;background:#6c170b;color:#f8ebd0;border-radius:99px;font-weight:700;padding:26px 46px;box-shadow:0 14px 30px rgba(0,0,0,.4)}
img{display:block}
.shadow{filter:drop-shadow(0 26px 40px rgba(0,0,0,.55))}
</style></head><body class="/*MODE*/">
/*BODY*/
</body></html>
