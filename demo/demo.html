h1,h2,h3,.t{font-family:'Archivo Variable',Impact,sans-serif;font-stretch:86%;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;line-height:.95}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit}
.bar{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px;background:rgba(16,48,31,.96);backdrop-filter:blur(6px);border-bottom:1px solid rgba(248,235,208,.12)}
.bar b{font-family:'Archivo Variable';font-stretch:86%;font-weight:900;text-transform:uppercase;font-size:18px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:99px;font-weight:600;font-size:13px;min-height:38px;transition:.18s}
.btn{background:var(--wine);color:var(--cream)}.btn:hover{background:var(--wine6);transform:translateY(-1px)}
.btn-c{background:var(--cream);color:var(--wine)}.btn-c:hover{background:var(--c50)}
.btn-g{border:1px solid rgba(248,235,208,.35);color:var(--cream)}.btn-g:hover{background:rgba(248,235,208,.1)}
.btn-gd{border:1px solid rgba(108,23,11,.3);color:var(--wine)}.btn-gd:hover{background:rgba(108,23,11,.08)}
.btn-e{background:var(--ember);color:#fff}
.sm{padding:5px 12px;min-height:32px;font-size:12px}
.demo-tag{background:var(--ember);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:3px 10px;letter-spacing:.08em}
.stage{display:grid;grid-template-columns:430px 1fr;gap:26px;padding:22px 22px 80px;max-width:1700px;margin:0 auto;align-items:start}
@media(max-width:1000px){.stage{grid-template-columns:1fr}}
.lbl{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75;margin-bottom:10px}
/* celular */
.phone{width:402px;max-width:100%;margin:0 auto;border-radius:52px;background:#0b1a13;padding:9px;box-shadow:0 30px 70px -20px #000,0 0 0 2px #2c3d34;position:sticky;top:72px}

.scroll{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;color:var(--cream)}.scroll::-webkit-scrollbar{display:none}
.notch{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:24px;border-radius:99px;background:#050c09;z-index:5}
.p-head{padding:44px 18px 8px}
.p-chips{position:sticky;top:0;z-index:3;background:rgba(20,58,44,.97);padding:10px 12px 10px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.p-chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;background:rgba(248,235,208,.12);font-size:12.5px;font-weight:600}.chip.on{background:var(--cream);color:var(--wine)}
.pcard{display:flex;background:var(--cream);color:var(--wine);border-radius:24px;margin:0 14px 12px;overflow:hidden;box-shadow:0 10px 24px -12px #000;text-align:left;width:calc(100% - 28px);transition:.2s}
.pcard:hover{transform:translateY(-2px)}
.pcard .tx{flex:1;padding:14px 14px 12px;min-width:0}
.pcard h3{font-size:19px;margin-bottom:6px}
.pcard p{font-size:11.5px;line-height:1.35;color:#4a1a10;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{display:inline-block;background:var(--g9);color:var(--cream);border-radius:99px;padding:6px 13px;font-family:'Archivo Variable';font-weight:900;font-size:14px;margin-top:8px}
.art{width:118px;flex:none;background:var(--g9)}.art svg{width:100%;height:100%;display:block}
.cat-h{margin:18px 18px 10px;font-size:28px}
.cartbar{position:absolute;left:14px;right:14px;bottom:14px;z-index:6;display:flex;justify-content:space-between;align-items:center;background:var(--wine);color:var(--cream);padding:14px 22px;border-radius:99px;font-weight:600;box-shadow:0 12px 30px -8px #000;animation:up .3s}
.cartbar i{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:99px;background:var(--cream);color:var(--wine);font-style:normal;font-weight:800;font-size:13px;margin-right:8px}
.over{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:var(--cream);color:#4a1a10;border-radius:30px 30px 0 0;padding:18px 18px 18px;animation:up .28s;scrollbar-width:none}
.sheet h2{color:var(--wine);font-size:26px}
.grp{background:var(--c50);border-radius:18px;padding:12px;margin-top:12px;box-shadow:inset 0 0 0 1px rgba(108,23,11,.1)}
.grp h4{font-family:'Archivo Variable';font-stretch:86%;font-weight:900;text-transform:uppercase;color:var(--wine);font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.grp h4 small{font-family:Poppins;font-size:10px;opacity:.7;font-weight:600}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--cream);font-size:13px;text-align:left}
.opt.on{background:var(--wine);color:var(--cream)}
.opt s{text-decoration:none;font-size:11.5px;font-weight:600}
.f{width:100%;border:1px solid rgba(108,23,11,.25);background:var(--c50);border-radius:14px;padding:9px 12px;font-size:13px;color:#3d140b}
.f:focus{outline:2px solid rgba(108,23,11,.35)}
label.l{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(108,23,11,.8);margin:12px 0 4px}
.stp{display:inline-flex;align-items:center;background:rgba(108,23,11,.1);border-radius:99px}.stp button{width:38px;height:38px;font-weight:800;color:var(--wine);font-size:18px}.stp span{width:26px;text-align:center;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px}
/* equipe */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:9px 16px;border-radius:99px;background:rgba(248,235,208,.1);font-size:13px;font-weight:600;position:relative}.tab.on{background:var(--cream);color:var(--wine)}
.tab em{position:absolute;top:-6px;right:-4px;background:var(--ember);color:#fff;border-radius:99px;font-size:10px;padding:1px 7px;font-style:normal;font-weight:700}
.panel{background:var(--cream);color:#4a1a10;border-radius:26px;padding:22px;box-shadow:0 10px 28px -14px #000}
.panel h2{color:var(--wine);font-size:26px;margin-bottom:12px}
.panel h3{color:var(--wine);font-size:18px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:1250px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}
@media(max-width:700px){.g2{grid-template-columns:1fr}}
.stat{border-radius:22px;padding:16px 18px;background:var(--cream);color:var(--wine)}.stat.d{background:rgba(16,48,31,.8);color:var(--cream);box-shadow:inset 0 0 0 1px rgba(248,235,208,.1)}
.stat small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.stat b{display:block;font-family:'Archivo Variable';font-stretch:86%;font-weight:900;font-size:30px;margin:2px 0;line-height:1.05;text-transform:uppercase}
.stat span{font-size:11.5px;opacity:.7}
.badge{display:inline-block;border-radius:99px;padding:4px 10px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.s-recebido{background:var(--cream3);color:#3f0c05}.s-aguardando_impressao{background:var(--ember);color:#fff}.s-em_preparo{background:var(--amber);color:#3f0c05}.s-pronto{background:var(--g6);color:#fff}.s-entregue{background:var(--g9);color:var(--cream)}.s-cancelado{background:var(--wine);color:var(--cream);text-decoration:line-through}
.ok{background:var(--g6);color:#fff}.wait{background:var(--cream3);color:#3f0c05}.bad{background:var(--ember);color:#fff}.go{background:var(--amber);color:#3f0c05}
.ocard{background:var(--c50);border-radius:20px;padding:14px;box-shadow:inset 0 0 0 1px rgba(108,23,11,.1)}
.kcol{background:rgba(16,48,31,.7);border-radius:26px;padding:12px;box-shadow:inset 0 0 0 1px rgba(248,235,208,.1);min-height:200px}
.kcol h3{color:var(--cream);display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;font-size:20px}
.kcol h3 span{background:var(--cream);color:var(--wine);border-radius:99px;min-width:26px;text-align:center;font-size:13px;padding:3px 8px}
.kcard{background:var(--cream);color:#4a1a10;border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 8px 20px -10px #000}
.kcard.new{animation:flash 1.1s infinite;outline:4px solid var(--ember)}
.kcard .mesa{font-family:'Archivo Variable';font-stretch:86%;font-weight:900;font-size:38px;text-transform:uppercase;color:var(--wine);line-height:1}
.kit{font-family:'Archivo Variable';font-stretch:86%;font-weight:900;text-transform:uppercase;font-size:19px;color:#4a1a10;margin-top:8px}
.kit b{background:var(--wine);color:var(--cream);border-radius:8px;padding:0 7px;margin-right:6px}
.ko{font-size:14px;font-weight:600;text-transform:uppercase;color:var(--wine);margin-left:4px}.ko i{opacity:.55;font-style:normal}
.kn{background:var(--ember);color:#fff;font-weight:800;text-transform:uppercase;border-radius:10px;padding:5px 10px;margin-top:5px;font-size:14px}
.mesa-btn{border-radius:22px;padding:14px;text-align:left;background:var(--cream);color:var(--wine);box-shadow:0 8px 20px -12px #000;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.mesa-btn.occ{background:var(--amber);color:#3f0c05}
.mesa-btn b{font-family:'Archivo Variable';font-weight:900;font-size:40px;line-height:1}
.mesa-btn small{font-size:11.5px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;text-align:left;opacity:.65;padding:6px 4px;border-bottom:1px solid rgba(108,23,11,.2)}td{padding:8px 4px;border-bottom:1px solid rgba(108,23,11,.1);vertical-align:middle}
.tog{width:42px;height:24px;border-radius:99px;background:rgba(108,23,11,.25);position:relative;transition:.2s;flex:none}.tog:after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tog.on{background:var(--g6)}.tog.on:after{left:20px}
.modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--cream);color:#4a1a10;border-radius:28px;padding:24px;width:min(560px,100%);max-height:92vh;overflow:auto;animation:pop .22s}
.modal h2{color:var(--wine);font-size:28px;margin-bottom:10px}
/* comanda */
.paper{background:#d9d5cb;border-radius:22px;padding:22px;display:flex;justify-content:center;overflow:auto}
.ticket{background:#fff;color:#000;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:13px;line-height:1.25;font-family:Poppins,Arial,sans-serif}
.ticket.w58{width:222px;font-size:11px}.ticket.w80{width:310px}.ticket.wa4{width:560px;font-size:15px}
.t-c{text-align:center}.t-xl{font-family:'Archivo Variable';font-weight:900;font-size:1.7em;line-height:1.1}.t-lg{font-weight:800;font-size:1.3em;line-height:1.15}.t-b{font-weight:800}
.t-inv{background:#000;color:#fff;padding:.15em .3em;margin:.3em 0;text-align:center;font-weight:800;font-size:1.2em}
.t-r{border:0;border-top:1px dashed #000;margin:.45em 0}.t-rs{border:0;border-top:2px solid #000;margin:.5em 0}
.t-p{display:flex;justify-content:space-between;gap:8px}.t-i{padding-left:.9em}
.t-re{border:2px solid #000;text-align:center;font-weight:800;padding:3px;margin:4px 0}
.log{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#0b1a13;color:#bfe3cf;border-radius:16px;padding:12px;max-height:230px;overflow:auto}
.log div{padding:2px 0}.log .e{color:#ff9d7a}
.cur{position:fixed;z-index:200;width:26px;height:26px;margin:-4px 0 0 -4px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 3px rgba(217,82,43,.9),0 6px 16px #0008;pointer-events:none;opacity:0;transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1),opacity .3s,transform .12s}
.cur.on{opacity:1}.cur.down{transform:scale(.7)}

function totals(){
 const B=S.base,f={day:1,week:6.4,month:27}[T.range];const live=liveOrders();
 const regLive=live.reduce((a,o)=>a+o.total,0),recLive=S.payments.reduce((a,p)=>a+p.amount,0);
 const top={};Object.entries(B.top).forEach(([k,v])=>top[k]={q:Math.round(v.q*f),rev:Math.round(v.rev*f)});
 live.forEach(o=>o.items.forEach(i=>{const t=top[i.name]||(top[i.name]={q:0,rev:0});t.q+=i.q;t.rev+=i.line}));
 let rec=B.rec.slice(),reg=B.reg.slice(),ord=B.ord.slice(),labels=B.hours;
 if(T.range!=='day'){const n=T.range==='week'?7:30;labels=[];rec=[];reg=[];ord=[];for(let i=0;i<n;i++){const d=new Date(Date.now()-(n-1-i)*864e5);labels.push(String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'));const w=0.62+0.38*Math.abs(Math.sin(i*1.7+1)),wk=[0,6].includes(d.getDay())?1.35:1;const r=Math.round(B.received*w*wk/100)*100*(T.range==='week'?1:1);rec.push(r);reg.push(Math.round(r*1.08/100)*100);ord.push(Math.round(B.orders*w*wk))}}
 rec[rec.length-1]+=recLive;reg[reg.length-1]+=regLive;ord[ord.length-1]+=live.length;
 if(T.range==='day')labels=labels;
 const sum=a=>a.reduce((x,y)=>x+y,0);
 return{received:T.range==='day'?B.received+recLive:sum(rec),registered:T.range==='day'?B.registered+regLive:sum(reg),orders:T.range==='day'?B.orders+live.length:sum(ord),cancelled:B.cancelled+S.orders.filter(o=>o.status==='cancelado').length,
  inprog:S.orders.filter(o=>['recebido','aguardando_impressao','em_preparo'].includes(o.status)).length,done:S.orders.filter(o=>['pronto','entregue'].includes(o.status)).length+B.orders-4,
  top:Object.entries(top).sort((a,b)=>b[1].q-a[1].q).slice(0,6),series:{labels,rec,reg,ord},recLive}}

   const unit=p.price+opts.reduce((a,o)=>a+o.p,0),key=p.id+opts.map(o=>o.n).join()+P.notes;
   const ex=P.cart.find(l=>l.key===key);if(ex)ex.q+=P.qty;else P.cart.push({key,id:p.id,name:p.name,unit,q:P.qty,opts,notes:P.notes.trim(),prep:p.prep});
   P.sheet=null;renderPhone();break}
  case'cart':P.cartOpen=true;P.err='';renderPhone();break;
  case'closecart':P.cartOpen=false;renderPhone();break;
  case'cq':{const l=P.cart[+d.i];l.q+=+d.d;if(l.q<=0)P.cart.splice(+d.i,1);if(!P.cart.length)P.cartOpen=false;const st=$('#povl .sheet')?.scrollTop||0;renderPhone();if($('#povl .sheet'))$('#povl .sheet').scrollTop=st;break}
  case'crm':P.cart.splice(+d.i,1);if(!P.cart.length)P.cartOpen=false;renderPhone();break;
  case'confirm':{P.name=($('#pname')||{}).value||'';if(!P.table){P.err='Selecione o número da mesa.';const st=$('#povl .sheet').scrollTop;renderPhone();$('#povl .sheet').scrollTop=st+200;return}
   P.done=newOrder();P.cart=[];P.cartOpen=false;P.err='';bump();break}
  case'again':P.done=null;renderPhone();break;
  case'stab':T.tab=d.t;T.reprint=false;renderStaff();break;
  case'status':{const o=S.orders.find(x=>x.n==d.n);o.status=d.to;o.fresh=false;bump();break}
  case'filter':T.filter=d.f;renderStaff();break;
  case'cancel':{$('#modal').innerHTML=`<div class="modal"><div class="box" data-stop="1"><h2 class="t">Cancelar pedido #${d.n}</h2><label class="l">Motivo (obrigatório)</label><select class="f" id="creason"><option>Cliente desistiu</option><option>Prato indisponível</option><option>Pedido duplicado</option></select><div class="row" style="margin-top:14px"><button class="pill btn-gd" data-act="closemodal">Voltar</button><button class="pill btn-e" data-act="docancel" data-n="${d.n}">Confirmar cancelamento</button></div></div></div>`;break}
  case'docancel':{const o=S.orders.find(x=>x.n==d.n);o.status='cancelado';o.cancel=$('#creason').value;o.fresh=false;$('#modal').innerHTML='';bump();break}
  case'closemodal':$('#modal').innerHTML='';break;
  case'viewprint':T.printN=+d.n;T.tab='impressao';renderStaff();break;
  case'mesa':T.tableSel=d.t;modalMesa(d.t);break;
  case'closeTab':modalClose(d.t,1,['pix']);break;
  case'split':{const t=d.t,n=+d.n,old=modalClose.state?.methods||[];modalClose(t,n,Array.from({length:n},(_,i)=>old[i]||'pix'));break}
  case'paid':{const t=d.t,tab=S.tabs['T'+t],tot=tabSum(tab),n=+d.n,ms=modalClose.state.methods,base=Math.floor(tot/n),ex=tot-base*n;
   for(let i=0;i<n;i++)S.payments.push({table:t,payer:'Pessoa '+(i+1),method:ms[i]||'pix',amount:base+(i<ex?1:0)});
   tab.paid=true;S.orders.filter(o=>o.tab===tab.id&&o.status==='pronto').forEach(o=>o.status='entregue');$('#modal').innerHTML='';bump();break}
  case'range':T.range=d.r;renderStaff();break;
  case'csv':{const rows=[['Mesa','Pagador','Forma','Valor'],...S.payments.map(p=>[p.table,p.payer,PAY[p.method],(p.amount/100).toFixed(2).replace('.',',')])];const blob=new Blob(['﻿'+rows.map(r=>r.join(';')).join('\r\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pagamentos.csv';a.click();break}
  case'avail':{const p=S.products.find(x=>x.id===d.id);p.avail=!p.avail;bump();break}
  case'feat':{const p=S.products.find(x=>x.id===d.id);p.feat=!p.feat;bump();break}
  case'newprod':modalNew();break;
  case'saveprod':{const name=$('#np-name').value.trim(),price=Math.round(parseFloat($('#np-price').value.replace(',','.'))*100);if(!name||!price)return;S.products.push({id:'n'+Date.now(),cat:+$('#np-cat').value,name,desc:$('#np-desc').value||'Novo prato do chef.',price,prep:15,art:['steak','pasta','fish','dessert','risotto'][+$('#np-cat').value%5],avail:true,groups:[]});$('#modal').innerHTML='';bump();break}
  case'failtog':S.printerFail=!S.printerFail;renderStaff();break;
  case'retry':{const j=S.jobs.find(x=>x.id==d.id);j.status='queued';runJob(j);break}
  case'via':T.via=d.v;renderStaff();break;
  case'paper':T.paper=d.p;renderStaff();break;
  case'reprint':{const n=+d.n;T.reprint=true;[['cozinha','80','tcp://192.168.0.50:9100'],['atendimento','58','tcp://192.168.0.51:9100']].filter(x=>x[0]===T.via).forEach(([via,paper,target])=>{const j={id:S.jobId++,n,via,paper,target,status:'queued',attempts:0,msg:'',reprint:true,at:Date.now()};S.jobs.push(j);runJob(j)});renderStaff();break}
  case'browserprint':window.print();break;
  case'sound':K.sound=!K.sound;$('#soundbtn').textContent=K.sound?'🔔 Som ligado':'🔕 Som desligado';if(K.sound)beep();break;
  case'reset':init();stopTour();bump();$('#modal').innerHTML='';break;
  case'tour':tour();break;
  case'stop':stopTour();break;
 }
}
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]');if(!a)return;
 if(a.dataset.bg&&e.target!==a)return; // clique no fundo escuro fecha; dentro do painel não
 act(a.dataset.act,a.dataset,a)});
document.addEventListener('change',e=>{
 const c=e.target.dataset.chg;if(!c)return;const v=e.target.value;
 if(c==='table'){P.table=v;P.name=($('#pname')||{}).value||P.name;renderPhone()}
 if(c==='price'){const p=S.products.find(x=>x.id===e.target.dataset.id),n=Math.round(parseFloat(v.replace(',','.'))*100);if(n>0){p.price=n;bump()}}
 if(c==='printn'){T.printN=+v;T.reprint=false;renderStaff()}
 if(c==='pm'){modalClose.state.methods[+e.target.dataset.i]=v}
});
setInterval(()=>{if(T.tab==='cozinha'||T.tab==='pedidos')renderStaff()},30000);
setInterval(()=>{S.orders.forEach(o=>{if(o.fresh&&Date.now()-o.created>60000)o.fresh=false})},5000);

/* ---------- apresentação automática ---------- */
let stopFlag=false,touring=false;
const sleep=ms=>new Promise((r,j)=>setTimeout(()=>stopFlag?j('stop'):r(),FAST?ms*.02:ms));
const cur=$('#cur'),cap=$('#cap');
const say=async(t,ms=2600)=>{cap.textContent=t;cap.classList.add('show');await sleep(ms)};
const hush=()=>cap.classList.remove('show');
async function tap(sel,pause=500){
 const el=typeof sel==='string'?$(sel):sel;if(!el)throw new Error('tour: não achei '+sel);
 el.scrollIntoView({block:'center',behavior:FAST?'auto':'smooth'});await sleep(350);
 const r=el.getBoundingClientRect();cur.style.left=(r.left+Math.min(r.width/2,60))+'px';cur.style.top=(r.top+r.height/2)+'px';cur.classList.add('on');await sleep(800);
 cur.classList.add('down');await sleep(130);(typeof sel==='string'?$(sel)||el:el).click();cur.classList.remove('down');await sleep(pause)}
async function typeIn(sel,text){const el=$(sel);el.scrollIntoView({block:'center',behavior:FAST?'auto':'smooth'});await sleep(300);const r=el.getBoundingClientRect();cur.style.left=(r.left+30)+'px';cur.style.top=(r.top+r.height/2)+'px';cur.classList.add('on');await sleep(800);el.focus();for(const ch of text){el.value+=ch;el.dispatchEvent(new Event('input'));await sleep(55)}await sleep(300)}
async function titleCard(html,ms){const c=$('#tcard');c.innerHTML=html;c.classList.add('show');await sleep(ms);c.classList.remove('show')}
async function selectVal(sel,val){const el=$(sel);el.scrollIntoView({block:'center',behavior:FAST?'auto':'smooth'});await sleep(300);const r=el.getBoundingClientRect();cur.style.left=(r.left+40)+'px';cur.style.top=(r.top+r.height/2)+'px';cur.classList.add('on');await sleep(800);el.value=val;el.dispatchEvent(new Event('change',{bubbles:true}));await sleep(600)}
function stopTour(){stopFlag=true;touring=false;cur.classList.remove('on');hush();$('#tcard').classList.remove('show');$('#stopbtn').classList.remove('show')}
async function tour(){
 if(touring)return;init();bump();$('#modal').innerHTML='';window.scrollTo(0,0);stopFlag=false;touring=true;$('#stopbtn').classList.add('show');
 try{
  await titleCard('<div><h1>Cardápio Digital</h1><p>Do pedido no celular até o caixa — tudo integrado</p></div>',3200);

  await tap('[data-act="opt"][data-g="1"][data-o="0"]');
  await tap('[data-act="opt"][data-g="2"][data-o="0"]');
  await typeIn('#pnotes','sem cebola');

  await tap('[data-act="addcart"]',700);
  await tap('[data-act="open"][data-id="salm"]',600);
  await tap('[data-act="opt"][data-g="0"][data-o="0"]');
  await typeIn('#pnotes','pouco sal');
  await tap('[data-act="addcart"]',700);
  await tap('[data-act="cart"]',800);
  await say('Escolhe a mesa e confirma. O preço final é conferido pelo servidor — não dá para alterar',3200);
  await selectVal('#ptable','9');
  await tap('[data-act="confirm"]',1500);
  await say('Pedido enviado! O cliente recebe o número e pode acompanhar o andamento',2600);
  await tap('[data-act="again"]',400);
  await say('2 · Na cozinha, o pedido aparece na hora, com alerta sonoro e destaque',2400);
  await tap('[data-act="stab"][data-t="cozinha"]',500);
  const nk=$('.kcard.new');if(nk)nk.scrollIntoView({block:'center',behavior:FAST?'auto':'smooth'});
  await say('Mesa grande, quantidades, ponto da carne, acompanhamentos e observações em destaque',3200);
  await say('3 · A comanda é impressa automaticamente na impressora da cozinha',2200);
  await tap('[data-act="stab"][data-t="impressao"]',600);
  await say('Térmica 58/80 mm ou A4. O sistema só marca como impressa quando a impressora confirma',3600);
  await tap('[data-act="via"][data-v="atendimento"]',900);
  await say('A via do atendimento traz os valores; a da cozinha foca na preparação',3000);
  await tap('[data-act="via"][data-v="cozinha"]',500);
  await say('4 · E se a impressora falhar? O sistema avisa, registra e permite tentar de novo',3000);
  await tap('[data-act="failtog"]',500);
  await say('Simulando a impressora da cozinha sem papel e fazendo um novo pedido…',2600);
  await tap('[data-act="open"][data-id="negr"]',600);
  await tap('[data-act="addcart"]',600);
  await tap('[data-act="cart"]',700);
  await tap('[data-act="confirm"]',1200);
  await tap('[data-act="again"]',500);
  await say('A comanda NÃO é marcada como impressa: o erro fica registrado e o pedido segue aguardando',3600);
  await tap('[data-act="failtog"]',500);
  await tap('[data-act="retry"]',600);
  await say('Papel reposto: um clique em “Tentar novamente” e a comanda sai',3000);
  await tap('[data-act="stab"][data-t="cardapio"]',500);

  await typeIn('#price-file','');$('#price-file').value='';await typeIn('#price-file','158,00');
  $('#price-file').dispatchEvent(new Event('change',{bubbles:true}));await sleep(600);
  await tap('[data-act="avail"][data-id="petit"]',700);
  await say('Filé-mignon agora custa R$ 158,00 e a sobremesa saiu do cardápio do cliente',3200);

  await tap('[data-act="stab"][data-t="cozinha"]',500);

 }catch(e){if(e!=='stop')console.error(e)}
 finally{stopTour();touring=false;hush();window.__tourDone=true}
}
init();bump();
